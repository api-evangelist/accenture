        description: Information Security Management System certification across delivery centres.
      - name: SOC 1 / SOC 2
        description: System and Organization Controls reports for managed-services and outsourcing engagements.
      - name: GDPR
        description: European General Data Protection Regulation compliance for personal data handled in delivery.
      - name: HIPAA
        description: Health Insurance Portability and Accountability Act compliance for U.S. healthcare client work.
      - name: FedRAMP (via partners)
        description: Accenture Federal Services operates within FedRAMP-authorized environments for U.S. federal clients.
