  - type: Features
    data:
      - name: AI Refinery Platform
        description: Accenture's reference platform for building and deploying generative-AI agents and pipelines for clients; delivered as engagements, not as a public API product.
      - name: Industrial AI
        description: Industry-specific AI accelerators packaged for client deployments across manufacturing, energy, life sciences, and financial services.
      - name: Cloud & Data Services
        description: Migration, modernization, and managed services for hyperscale cloud and data platforms (AWS, Azure, GCP, Snowflake, Databricks).
      - name: myConcerto
        description: Internal SAP-focused delivery platform Accenture uses on client SAP S/4HANA transformations; not a public API.
      - name: SynOps
        description: Accenture's intelligent-operations platform used inside managed-services engagements.
  - type: UseCases
    data:
      - name: Digital Transformation Programs
        description: Long-form consulting and systems-integration engagements modernizing client landscapes end-to-end.
      - name: Generative AI Adoption
        description: Standing up enterprise generative-AI capabilities, including foundation-model selection, RAG patterns, governance, and operations.
      - name: Managed Services
        description: Run-the-business operations of applications, infrastructure, and security on behalf of clients.
      - name: Industry Solutions
        description: Industry-specific solutions in financial services, life sciences, public sector, energy, and consumer goods.
  - type: Authentication
    data:
      - name: No Public API
        description: Accenture does not publish a public developer portal or external developer APIs. Accenture builds client-specific APIs as part of engagements and contributes to a wide range of cloud vendor and partner ecosystems; the resulting APIs live with each client or partner, not on an Accenture-branded developer surface.
  - type: Compliance
    data:
